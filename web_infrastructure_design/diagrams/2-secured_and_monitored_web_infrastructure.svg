<text x="117" y="1227" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<rect x="990" y="640" width="740" height="585" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1010" y="674" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="1010" dy="0">S3 · backend host · 10.0.0.12</tspan></text>
<text x="1010" y="704" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="1010" dy="0">Both backends serve web requests (active-active).</tspan></text>
<g data-box="1015,725,690,60">
<rect x="1015" y="725" width="690" height="60" rx="12" fill="#fff6e9" stroke="#a9611c" stroke-width="2.5" />
<text x="1037" y="759" font-size="24" font-weight="bold" text-anchor="start" style="fill:#a9611c" ><tspan x="1037" dy="0">FW3 · :80 from S1; :3306 from peer only</tspan></text>
<text x="1037" y="792" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<g data-box="1015,800,690,65">
<rect x="1015" y="800" width="690" height="65" rx="12" fill="#eef5fc" stroke="#2867a8" stroke-width="2.5" />
<text x="1037" y="834" font-size="24" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="1037" dy="0">Nginx · static files / reverse proxy</tspan></text>
<text x="1037" y="867" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<g data-box="1015,905,690,95">
<rect x="1015" y="905" width="690" height="95" rx="12" fill="#edf8f6" stroke="#167d8d" stroke-width="2.5" />
<text x="1037" y="939" font-size="24" font-weight="bold" text-anchor="start" style="fill:#167d8d" ><tspan x="1037" dy="0">Gunicorn + application files</tspan></text>
<text x="1037" y="972" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1037" dy="0">Same application release on both hosts</tspan></text>
</g>
<polyline class="edge" points="1355,865 1355,905" stroke="#2867a8" marker-end="url(#blue)"  />
<g data-box="1015,1055,690,90">
<rect x="1015" y="1055" width="690" height="90" rx="12" fill="#f5f0fc" stroke="#7652a6" stroke-width="2.5" />
<text x="1037" y="1089" font-size="24" font-weight="bold" text-anchor="start" style="fill:#7652a6" ><tspan x="1037" dy="0">MySQL · REPLICA</tspan></text>
<text x="1037" y="1122" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1037" dy="0">Read-only application queries; may lag</tspan></text>
</g>
<g data-box="1015,1160,690,60">
<rect x="1015" y="1160" width="690" height="60" rx="12" fill="#edf8f6" stroke="#247b56" stroke-width="2.5" />
<text x="1037" y="1194" font-size="24" font-weight="bold" text-anchor="start" style="fill:#247b56" ><tspan x="1037" dy="0">Collector 3 · host metrics + service logs</tspan></text>
<text x="1037" y="1227" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<polyline class="edge" points="725,555 725,610 750,610 750,725" stroke="#2867a8" marker-end="url(#blue)"  />
