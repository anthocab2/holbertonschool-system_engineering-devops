<text x="117" y="867" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<g data-box="95,905,690,95">
<rect x="95" y="905" width="690" height="95" rx="12" fill="#edf8f6" stroke="#167d8d" stroke-width="2.5" />
<text x="117" y="939" font-size="24" font-weight="bold" text-anchor="start" style="fill:#167d8d" ><tspan x="117" dy="0">Gunicorn + application files</tspan></text>
<text x="117" y="972" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="117" dy="0">Same application release on both hosts</tspan></text>
</g>
<polyline class="edge" points="435,865 435,905" stroke="#2867a8" marker-end="url(#blue)"  />
