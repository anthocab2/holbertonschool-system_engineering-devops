<text x="1322" y="402" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1322" dy="0">HAProxy logs + host metrics</tspan></text>
</g>
<polyline class="edge" points="1230,465 1270,465 1270,380 1300,380" stroke="#247b56" marker-end="url(#green)"  stroke-dasharray="9 6"/>
<g data-box="1240,1248,495,85">
<rect x="1240" y="1248" width="495" height="85" rx="12" fill="#edf8f6" stroke="#247b56" stroke-width="2.5" />
<text x="1262" y="1282" font-size="24" font-weight="bold" text-anchor="start" style="fill:#247b56" ><tspan x="1262" dy="0">External monitoring service</tspan></text>
<text x="1262" y="1315" font-size="18" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1262" dy="0">Dashboards and alerts</tspan></text>
</g>
<polyline class="edge" points="1735,380 1770,380 1770,1285 1735,1285" stroke="#247b56" marker-end="url(#green)"  stroke-dasharray="9 6"/>
<polyline class="edge" points="440,1220 440,1285 1240,1285" stroke="#247b56" marker-end="url(#green)"  stroke-dasharray="9 6"/>
<polyline class="edge" points="1360,1220 1360,1248" stroke="#247b56" marker-end="url(#green)"  stroke-dasharray="9 6"/>
<text x="880" y="1268" font-size="18" font-weight="normal" text-anchor="middle" style="fill:#247b56" class="label"><tspan x="880" dy="0">Collectors 1–3 send telemetry over HTTPS</tspan></text>
<rect x="40" y="1344" width="1720" height="94" rx="10" fill="#f2f5f8"/>
<text x="62" y="1379" font-size="21" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="62" dy="0">Remaining issues: one load balancer; one database writer; unencrypted LB → web traffic; coupled backend roles.</tspan><tspan x="62" dy="28">QPS: change in Nginx request counter ÷ elapsed seconds. Monitor each web host and the combined total.</tspan></text>
