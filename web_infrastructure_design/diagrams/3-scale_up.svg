<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1320" viewBox="0 0 2020 1320" role="img" aria-label="3 · Scale up"><title>3 · Scale up</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2867a8"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7652a6"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247b56"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9611c"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b43} .edge{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .label{paint-order:stroke;stroke:white;stroke-width:9;stroke-linejoin:round}</style><rect width="2020" height="1320" fill="white"/>
<text x="40" y="56" font-size="37" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="40" dy="0">3 · Scale up</tspan></text>
<text x="42" y="94" font-size="22" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="42" dy="0">Dedicated tiers · redundant HAProxy pair · independent web, application and database hosts</tspan></text>
<g data-box="45,145,470,110">
<rect x="45" y="145" width="470" height="110" rx="12" fill="#eef5fc" stroke="#2867a8" stroke-width="2.5" />
<text x="67" y="179" font-size="24" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="67" dy="0">User / browser</tspan></text>
<text x="67" y="212" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="67" dy="0">https://www.foobar.com</tspan></text>
</g>
<g data-box="1190,145,780,110">
<rect x="1190" y="145" width="780" height="110" rx="12" fill="#eef5fc" stroke="#2867a8" stroke-width="2.5" />
<text x="1212" y="179" font-size="24" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="1212" dy="0">DNS · foobar.com</tspan></text>
<text x="1212" y="212" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1212" dy="0">www.foobar.com. A 8.8.8.8 (shared virtual IP)</tspan></text>
</g>
<polyline class="edge" points="515,190 1190,190" stroke="#52677b" marker-end="url(#muted)" marker-start="url(#muted)" stroke-dasharray="9 6"/>
<text x="850" y="178" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#52677b" class="label"><tspan x="850" dy="0">DNS query / IP response</tspan></text>
<g data-box="590,300,790,80">
<rect x="590" y="300" width="790" height="80" rx="12" fill="#fff6e9" stroke="#a9611c" stroke-width="2.5" />
<text x="612" y="334" font-size="24" font-weight="bold" text-anchor="start" style="fill:#a9611c" ><tspan x="612" dy="0">Floating virtual IP · 8.8.8.8</tspan></text>
<text x="612" y="367" font-size="19" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="612" dy="0">Only the active load balancer owns this address.</tspan></text>
</g>
<polyline class="edge" points="280,255 280,340 590,340" stroke="#2867a8" marker-end="url(#blue)"  />
<text x="400" y="325" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#52677b" class="label"><tspan x="400" dy="0">HTTPS :443</tspan></text>
<text x="55" y="440" font-size="23" font-weight="bold" text-anchor="start" style="fill:#52677b" ><tspan x="55" dy="0">LOAD BALANCING</tspan></text>
<text x="560" y="440" font-size="23" font-weight="bold" text-anchor="start" style="fill:#52677b" ><tspan x="560" dy="0">WEB TIER</tspan></text>
<text x="1065" y="440" font-size="23" font-weight="bold" text-anchor="start" style="fill:#52677b" ><tspan x="1065" dy="0">APPLICATION TIER</tspan></text>
<text x="1570" y="440" font-size="23" font-weight="bold" text-anchor="start" style="fill:#52677b" ><tspan x="1570" dy="0">DATABASE TIER</tspan></text>
<rect x="45" y="470" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="65" y="504" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="65" dy="0">LB1 · HAProxy + Keepalived</tspan></text>
<text x="65" y="534" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="65" dy="0">ACTIVE · TLS certificate</tspan></text>
<text x="67" y="575" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="67" dy="0">Owns VIP; health checks;</tspan><tspan x="67" dy="28">round robin to WEB1 / WEB2</tspan></text>
<rect x="45" y="765" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="65" y="799" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="65" dy="0">LB2 · HAProxy + Keepalived</tspan></text>
<text x="65" y="829" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="65" dy="0">STANDBY · matching certificate</tspan></text>
<text x="67" y="870" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="67" dy="0">Takes VIP after failure;</tspan><tspan x="67" dy="28">same backend configuration</tspan></text>
<polyline class="edge" points="770,380 770,410 250,410 250,470" stroke="#2867a8" marker-end="url(#blue)"  />
<polyline class="edge" points="1200,380 1200,405 20,405 20,850 45,850" stroke="#52677b" marker-end="url(#muted)"  stroke-dasharray="9 6"/>
<polyline class="edge" points="245,640 245,765" stroke="#a9611c" marker-end="url(#orange)" marker-start="url(#orange)" stroke-dasharray="9 6"/>
<text x="245" y="688" font-size="19" font-weight="normal" text-anchor="middle" style="fill:#a9611c" class="label"><tspan x="245" dy="0">VRRP heartbeat</tspan><tspan x="245" dy="26">+ HAProxy health check</tspan></text>
<rect x="550" y="470" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="570" y="504" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="570" dy="0">WEB1 · Nginx</tspan></text>
<text x="570" y="534" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="570" dy="0">Dedicated web-server host</tspan></text>
<text x="572" y="575" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="572" dy="0">Static assets; proxy dynamic</tspan><tspan x="572" dy="28">requests to APP1 / APP2</tspan></text>
<rect x="1055" y="470" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1075" y="504" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="1075" dy="0">APP1 · Gunicorn + code</tspan></text>
<text x="1075" y="534" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="1075" dy="0">Dedicated application host</tspan></text>
<text x="1077" y="575" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1077" dy="0">Business logic; identical code;</tspan><tspan x="1077" dy="28">SQL routing to the DB tier</tspan></text>
<rect x="550" y="765" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="570" y="799" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="570" dy="0">WEB2 · Nginx</tspan></text>
<text x="570" y="829" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="570" dy="0">Dedicated web-server host</tspan></text>
<text x="572" y="870" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="572" dy="0">Static assets; proxy dynamic</tspan><tspan x="572" dy="28">requests to APP1 / APP2</tspan></text>
<rect x="1055" y="765" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1075" y="799" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="1075" dy="0">APP2 · Gunicorn + code</tspan></text>
<text x="1075" y="829" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="1075" dy="0">Dedicated application host</tspan></text>
<text x="1077" y="870" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1077" dy="0">Business logic; identical code;</tspan><tspan x="1077" dy="28">SQL routing to the DB tier</tspan></text>
<rect x="1560" y="470" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1580" y="504" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="1580" dy="0">DB1 · MySQL primary</tspan></text>
<text x="1580" y="534" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="1580" dy="0">Dedicated database host</tspan></text>
<text x="1582" y="575" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1582" dy="0">Application writes;</tspan><tspan x="1582" dy="28">fresh reads</tspan></text>
<rect x="1560" y="765" width="410" height="170" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1580" y="799" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="1580" dy="0">DB2 · MySQL replica</tspan></text>
<text x="1580" y="829" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="1580" dy="0">Dedicated database host</tspan></text>
<text x="1582" y="870" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1582" dy="0">Optional read traffic;</tspan><tspan x="1582" dy="28">asynchronous replication</tspan></text>
<polyline class="edge" points="455,555 495,555 495,850 550,850" stroke="#2867a8" marker-end="url(#blue)"  />
<polyline class="edge" points="455,850 495,850 495,555 550,555" stroke="#2867a8" marker-end="url(#blue)"  />
<polyline class="edge" points="960,555 1005,555 1005,850 1055,850" stroke="#167d8d" marker-end="url(#teal)"  />
<polyline class="edge" points="960,850 1005,850 1005,555 1055,555" stroke="#167d8d" marker-end="url(#teal)"  />
<polyline class="edge" points="1465,555 1510,555 1510,850 1560,850" stroke="#7652a6" marker-end="url(#violet)"  />
<polyline class="edge" points="1465,850 1510,850 1510,555 1560,555" stroke="#7652a6" marker-end="url(#violet)"  />
<polyline class="edge" points="1765,640 1765,765" stroke="#7652a6" marker-end="url(#violet)"  stroke-dasharray="9 6"/>
<text x="1765" y="700" font-size="19" font-weight="normal" text-anchor="middle" style="fill:#7652a6" class="label"><tspan x="1765" dy="0">Primary → replica</tspan><tspan x="1765" dy="26">data flow</tspan></text>
<text x="560" y="985" font-size="21" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="560" dy="0">HTTPS to web tier</tspan></text>
<text x="1060" y="985" font-size="21" font-weight="bold" text-anchor="start" style="fill:#167d8d" ><tspan x="1060" dy="0">HTTP on private network</tspan></text>
<text x="1565" y="985" font-size="21" font-weight="bold" text-anchor="start" style="fill:#7652a6" ><tspan x="1565" dy="0">SQL :3306 with TLS</tspan></text>
<g data-box="45,1035,1925,105">
<rect x="45" y="1035" width="1925" height="105" rx="12" fill="#edf8f6" stroke="#247b56" stroke-width="2.5" />
<text x="67" y="1069" font-size="24" font-weight="bold" text-anchor="start" style="fill:#247b56" ><tspan x="67" dy="0">Security and monitoring retained on all eight hosts</tspan></text>
<text x="67" y="1102" font-size="21" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="67" dy="0">Host firewalls allow only required peer traffic; collectors send logs and metrics to the external monitoring service.</tspan><tspan x="67" dy="28">VIP failover needs a network that supports it. Replication alone does not provide automatic database promotion.</tspan></text>
</g>
<rect x="40" y="1194" width="1940" height="94" rx="10" fill="#f2f5f8"/>
<text x="62" y="1229" font-size="21" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="62" dy="0">Explicit design choice: 8 hosts retain both web/app copies and the DB replica while giving each role its own host.</tspan><tspan x="62" dy="28">Adds more than the minimum one-server increment. One MySQL writer remains; this is not complete high availability.</tspan></text>
</svg>
