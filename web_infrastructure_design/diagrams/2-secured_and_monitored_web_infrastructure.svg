<text x="117" y="1089" font-size="24" font-weight="bold" text-anchor="start" style="fill:#7652a6" ><tspan x="117" dy="0">MySQL · PRIMARY</tspan></text>
<text x="117" y="1122" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="117" dy="0">All writes and freshness-sensitive reads</tspan></text>
</g>
