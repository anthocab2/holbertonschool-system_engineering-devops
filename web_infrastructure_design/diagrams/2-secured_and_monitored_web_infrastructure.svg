<text x="587" y="382" font-size="24" font-weight="bold" text-anchor="start" style="fill:#a9611c" ><tspan x="587" dy="0">FW1 · inbound TCP 443; optional 80 redirect</tspan></text>
<text x="587" y="415" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ></text>
</g>
<g data-box="565,427,640,105">
<rect x="565" y="427" width="640" height="105" rx="12" fill="#eef5fc" stroke="#2867a8" stroke-width="2.5" />
<text x="587" y="461" font-size="24" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="587" dy="0">HAProxy · TLS termination</tspan></text>
<text x="587" y="494" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="587" dy="0">Certificate: www.foobar.com · round robin</tspan></text>
</g>
<polyline class="edge" points="270,255 270,380 540,380" stroke="#2867a8" marker-end="url(#blue)" marker-start="url(#blue)" />
<text x="322" y="359" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#52677b" class="label"><tspan x="322" dy="0">HTTPS / TCP 443</tspan></text>
<rect x="70" y="640" width="740" height="585" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="90" y="674" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="90" dy="0">S2 · backend host · 10.0.0.11</tspan></text>
<text x="90" y="704" font-size="20" font-weight="normal" text-anchor="start" style="fill:#52677b" ><tspan x="90" dy="0">Both backends serve web requests (active-active).</tspan></text>
