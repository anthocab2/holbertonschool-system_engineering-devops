<text x="1132" y="184" font-size="24" font-weight="bold" text-anchor="start" style="fill:#2867a8" ><tspan x="1132" dy="0">DNS · foobar.com</tspan></text>
<text x="1132" y="217" font-size="22" font-weight="normal" text-anchor="start" style="fill:#142b43" ><tspan x="1132" dy="0">www.foobar.com.   A   8.8.8.8</tspan></text>
</g>
<polyline class="edge" points="480,186 1110,186" stroke="#52677b" marker-end="url(#muted)" marker-start="url(#muted)" stroke-dasharray="9 6"/>
<text x="790" y="174" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#52677b" class="label"><tspan x="790" dy="0">DNS query / IP response</tspan></text>
<rect x="540" y="295" width="690" height="260" rx="12" fill="white" stroke="#52677b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="560" y="329" font-size="24" font-weight="bold" text-anchor="start" style="fill:#142b43" ><tspan x="560" dy="0">S1 · load-balancer host · 8.8.8.8</tspan></text>
<g data-box="565,348,640,64">
