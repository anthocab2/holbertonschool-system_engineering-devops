<text x="900" y="1006" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#7652a6" class="label"><tspan x="900" dy="0">Both apps write to PRIMARY</tspan></text>
<polyline class="edge" points="1360,1000 1360,1055" stroke="#7652a6" marker-end="url(#violet)"  />
<text x="1470" y="1036" font-size="18" font-weight="normal" text-anchor="middle" style="fill:#7652a6" class="label"><tspan x="1470" dy="0">Optional reads</tspan></text>
